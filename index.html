<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefog Cloud</title>
<style>
:root{
  --navy:#14324a; --navy-2:#0f2738; --teal:#1d7f8c; --teal-light:#e3f2f4;
  --accent:#e8613c; --bg:#dde7f5; --panel:#eef3fa; --card:#ffffff;
  --line:#c9d6e8; --text:#1e2f3f; --muted:#6b7f92; --link:#1a6fb5;
  --ok:#2e9e5b; --warn-bg:#fff3c4; --warn-tx:#8a6d00; --paid-bg:#dcf5e5; --paid-tx:#1d7a45;
  --danger:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #7fb3d9;border-color:#7fb3d9}
/* ---------- login ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(20,50,74,.18);padding:38px 42px;width:380px}
.login-card h1{font-size:22px;color:var(--navy);text-align:center;letter-spacing:.5px}
.login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 22px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.login-card .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
.login-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:14px}
.btn:hover{background:var(--navy-2)}
.btn.block{width:100%;margin-top:20px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ghost:hover{background:var(--panel)}
.btn.small{padding:5px 12px;font-size:12px}
.btn.accent{background:var(--teal)}
.btn.accent:hover{background:#166571}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
/* ---------- app layout ---------- */
#app{display:none;min-height:100vh}
header.topbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:18px;color:var(--navy);display:flex;align-items:center;gap:8px}
.brand .mark{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,var(--teal) 50%,#9fd8de 50%)}
.userbox{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px}
.manual-link{display:inline-block;background:var(--teal);color:#fff!important;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;text-decoration:none!important}
.manual-link:hover{background:#166571}
.layout{display:flex;min-height:calc(100vh - 49px)}
nav.side{width:210px;background:var(--navy);color:#fff;padding:14px 0;flex-shrink:0}
nav.side .navttl{font-size:10px;letter-spacing:1px;color:#7fa3bd;padding:10px 18px 4px}
nav.side .clock{background:var(--navy-2);border-radius:8px;margin:2px 14px 8px;padding:10px 14px}
nav.side .clock .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
nav.side .clock .d{font-size:11px;color:#9db8cc;margin-top:2px}
.csvbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.btn.yellow{background:#f0c674;color:#5a4300}.btn.yellow:hover{background:#e6b85c}
.btn.blue{background:#5b9bd5}.btn.blue:hover{background:#4a89c4}
.btn.green{background:#57bb8a}.btn.green:hover{background:#46a878}
.secttl{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 10px}
.secttl .n{display:inline-block;margin-right:8px}
nav.side a{display:block;color:#dbe7f0;padding:9px 18px;font-size:13px;text-decoration:none}
nav.side a:hover{background:var(--navy-2)}
nav.side a.active{background:var(--teal);color:#fff;font-weight:600}
main#page{flex:1;padding:22px 26px;max-width:1150px}
.crumb{font-size:12px;color:var(--muted);text-align:right;margin-bottom:8px}
.crumb a{color:var(--link)}
h2.pagettl{font-size:18px;color:var(--navy);margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text]{flex:1;min-width:180px}
.toolbar select{width:auto}
.right{display:flex;justify-content:flex-end;margin:10px 0}
table.list{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.list th{color:var(--navy);font-weight:600;text-align:left;border-bottom:2px solid var(--line);padding:8px 6px;white-space:nowrap}
table.list td{border-bottom:1px solid #e4ebf5;padding:8px 6px;vertical-align:middle}
table.list tr:hover td{background:#f4f8fd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn-tx)}
.badge.paid{background:var(--paid-bg);color:var(--paid-tx)}
.badge.gray{background:#e8edf4;color:var(--muted)}
.icon-btn{background:none;border:none;font-size:15px;padding:2px 5px;color:var(--navy)}
.icon-btn:hover{color:var(--accent)}
.req{background:var(--danger);color:#fff;font-size:10px;border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:middle}
.field{margin-bottom:14px;max-width:560px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.formfoot{display:flex;gap:10px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.stat .t{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:4px}
.notice li{list-style:none;border-bottom:1px solid #e4ebf5;padding:8px 2px;font-size:13px}
.notice .d{color:var(--muted);font-size:11px;margin-right:10px}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 10px}
.pager button.cur{background:var(--navy);color:#fff}
.muted{color:var(--muted);font-size:12px}
.upload-box{border:2px dashed var(--line);border-radius:8px;background:#fff;padding:14px;text-align:center;font-size:12px;color:var(--muted)}
.upload-box.has{border-color:var(--teal);color:var(--teal)}
/* ---------- ledger tables ---------- */
table.sheet{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.sheet th{background:#eef2f8;border:1px solid var(--line);padding:6px;color:var(--navy);font-weight:600}
table.sheet td{border:1px solid var(--line);padding:4px}
table.sheet td input,table.sheet td select{border:none;border-radius:0;padding:5px 6px;background:transparent}
table.sheet td input:focus{outline:2px solid #7fb3d9}
table.sheet td.total{font-weight:700;background:#f4f8fd}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sheet-head .ttl{font-weight:700;color:var(--navy);font-size:15px}
.sheet-head .unit{margin-left:auto;font-size:11px;color:var(--muted)}
/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,39,56,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px;width:min(720px,94vw);max-height:90vh;overflow:auto}
.modal h3{color:var(--navy);margin-bottom:14px;font-size:16px}
/* ---------- invoice ---------- */
.invoice{background:#fff;padding:34px;max-width:760px;margin:0 auto;border:1px solid var(--line)}
.invoice h1{text-align:center;font-size:26px;letter-spacing:10px;margin-bottom:22px;color:var(--text)}
.inv-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:10px;font-size:13px}
.inv-total{font-size:16px;font-weight:700;border-bottom:2px solid var(--text);display:inline-block;padding:4px 30px 4px 4px;margin-top:8px}
table.inv{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
table.inv th{background:var(--navy);color:#fff;padding:7px 8px;border:1px solid var(--navy);font-weight:600}
table.inv td{border:1px solid #ccc;padding:7px 8px}
table.inv tr.inv-total-row td{background:#eef2f8;font-weight:700}
.inv-breakdown{margin-top:6px;display:flex;justify-content:flex-end}
.inv-breakdown table{border-collapse:collapse;font-size:12px}
.inv-breakdown td{padding:3px 6px;white-space:nowrap}
.inv-breakdown td.num{text-align:right;font-variant-numeric:tabular-nums}
.inv-note{font-size:11px;color:var(--muted);margin-top:6px}
.inv-bigtotal{text-align:right;margin:22px 0 6px;font-size:13px}
.inv-bigtotal .amt{font-size:24px;font-weight:700;color:var(--text);letter-spacing:1px;margin-left:10px}
.inv-due{text-align:right;font-size:12px;color:var(--muted);margin-bottom:16px}
@media print{
  body{background:#fff}
  body.printing-invoice #app,body.printing-invoice #loginView{display:none!important}
  #invoicePrintArea{display:block!important}
  .no-print{display:none!important}
}
#invoicePrintArea{display:none}
@media(max-width:800px){.layout{flex-direction:column}nav.side{width:100%;display:flex;flex-wrap:wrap}nav.side .navttl{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <h1>Bluefog Cloud</h1>
    <div class="sub">ログイン画面</div>
    <label>メールアドレス</label>
    <input type="email" id="loginEmail" placeholder="user@user.com" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="loginPw" placeholder="パスワード" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn block" onclick="doLogin()">ログインする</button>
    <div class="login-links">
      <a onclick="alert('デモ版のため会員登録は省略されています。\nuser@user.com / password でログインしてください。')">会員登録はこちら</a>
      <a onclick="alert('デモ版のためパスワード再発行は省略されています。')">パスワードを忘れた方</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Bluefog Cloud</div>
    <div class="userbox">
      <a class="manual-link" href="manual.html" target="_blank" title="ユーザー利用マニュアルを開く">📖 操作マニュアル</a>
      <span id="userLabel"></span>
      <button class="btn ghost small" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="sideNav">
      <div class="clock"><div class="t" id="clockTime">--:--:--</div><div class="d" id="clockDate"></div></div>
      <div class="navttl">MENU</div>
      <a data-page="home">ホーム</a>
      <a data-page="customers">顧客管理</a>
      <a data-page="sales">受注取引一覧</a>
      <a data-page="purchases">発注取引一覧(アップロード)</a>
      <div class="navttl">支払通知書管理</div>
      <a data-page="paynotices">支払通知書一覧</a>
      <a data-page="payform">支払通知書作成</a>
      <div class="navttl">会計帳簿</div>
      <a data-page="ledger">総勘定元帳</a>
      <a data-page="bs">貸借対照表</a>
      <a data-page="pl">損益計算書</a>
      <a data-page="cf">キャッシュフロー計算書</a>
      <div class="navttl">賃貸革命連携</div>
      <a data-page="m_landlords">家主基本情報</a>
      <a data-page="m_contractors">契約者情報</a>
      <a data-page="m_repairers">修繕業者情報</a>
      <a data-page="m_agents">仲介・管理業者情報</a>
      <a data-page="m_insurers">保険会社情報</a>
      <div class="navttl">設定</div>
      <a data-page="settings">会計・消費税設定</a>
      <a data-page="profile">プロフィール</a>
    </nav>
    <main id="page"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="invoicePrintArea"></div>

<script>
"use strict";
/* ================= state ================= */
const DEFAULT_DB = {
  profile:{name:"ユーザー企業 ご担当者", email:"user@user.com", pw:"password"},
  settings:{taxRate:10, rounding:"floor",
    company:{name:"ユーザー企業株式会社", regNo:"T1234567890123", zip:"600-0000",
      addr:"京都府京都市中京区〇〇町1-2-3", tel:"075-000-0000",
      bank:"〇〇銀行 △△支店 普通 1234567 ユーザーキギヨウ(カ"}},
  customers:[
    {id:"c1", name:"test1株式会社", person:"山田 太郎", email:"info@test1.co.jp", tel:"03-0000-0000", addr:"東京都千代田区1-1-1", site:"月末締め翌月末払い", regNo:"T9876543210987", memo:""},
    {id:"c2", name:"サンプル商事株式会社", person:"佐藤 花子", email:"sato@sample.co.jp", tel:"06-0000-0000", addr:"大阪府大阪市北区2-2-2", site:"20日締め翌月10日払い", regNo:"", memo:""}
  ],
  sales:[
    {id:"01h04cdeeq8pgxgswe8ab7qb83", date:"2026-05-11", custId:"c1", method:"現金", amount:55000, tax:5500, status:"請求済", invoiced:"", memo:"",
     items:[{name:"商品売上", amount:55000, rate:10}]},
    {id:"01h10apet73rdvnymkzqf3wq5f", date:"2026-05-21", custId:"c1", method:"現金", amount:185000, tax:17500, status:"請求済", invoiced:"2026-05-21 23:37", memo:"",
     items:[{name:"保守サポート費用(月額)", amount:135000, rate:10},{name:"商品B", amount:50000, rate:8}]}
  ],
  purchases:[
    {id:"5bzsfdnj2", date:"2026-05-21", custId:"c1", method:"現金", amount:88000, tax:8800, up:"2026-05-21", status:"支払い済", files:{}, memo:""},
    {id:"8jfrhv3ms", date:"2026-05-16", custId:"c1", method:"普通預金", amount:46200, tax:4620, up:"2026-05-16", status:"支払い済", files:{}, memo:""},
    {id:"85tagbt6s", date:"2026-05-15", custId:"c1", method:"現金", amount:27500, tax:2750, up:"2026-05-15", status:"支払い済", files:{}, memo:""}
  ],
  ledger:{date:"2026-05-02", rows:[{no:"test1", m:"1", d:"3", acct:"売掛金", note:"商品売上", page:"1", dr:55000, cr:0}]},
  bs:{date:"2026-08-16",
    assets:[{name:"現金及び預金", v:3550000},{name:"売掛金", v:1450000},{name:"固定資産", v:5500000}],
    liabs:[{name:"買掛金", v:980000},{name:"長期借入金", v:3200000}],
    equity:[{name:"資本金", v:5000000},{name:"利益剰余金", v:1320000}]},
  pl:{from:"2026-01-01", to:"2026-12-31",
    rows:[{name:"売上高", type:"収益", v:12800000},{name:"売上原価", type:"費用", v:6400000},{name:"販売費及び一般管理費", type:"費用", v:3200000}]},
  cf:{from:"2026-01-01", to:"2026-12-31", beg:2100000,
    op:[{name:"税引前当期純利益", v:3450000}],
    inv:[{name:"有形固定資産の取得による支出", v:-1200000}],
    fin:[{name:"長期借入金の返済による支出", v:-800000}]},
  paymentNotices:[
    {id:"SC-20260701-001", custId:"c1", title:"6月分お支払いのご案内", payDate:"2026-07-31", created:"2026-07-01",
     items:[{date:"2026-06-30", item:"業務委託料(6月分)", price:120000, unit:"式", qty:1, tax:"外税"},
            {date:"2026-06-30", item:"交通費実費", price:3200, unit:"式", qty:1, tax:"非課税"}]}
  ],
  masters:{m_landlords:[], m_contractors:[], m_repairers:[], m_agents:[], m_insurers:[]}
};
let db;
const LS_KEY="bluefog_cloud_db_v1";
function loadDb(){
  try{const s=localStorage.getItem(LS_KEY); if(s){db=JSON.parse(s);}}catch(e){}
  if(!db)db=JSON.parse(JSON.stringify(DEFAULT_DB));
  /* migration for saved data from older versions */
  if(!db.paymentNotices)db.paymentNotices=JSON.parse(JSON.stringify(DEFAULT_DB.paymentNotices));
  if(!db.masters)db.masters=JSON.parse(JSON.stringify(DEFAULT_DB.masters));
  (db.sales||[]).forEach(s=>{
    if(!s.items||!s.items.length) s.items=[{name:s.memo||"商品売上", amount:Number(s.amount)||0, rate:db.settings.taxRate}];
  });
}
function save(){ try{localStorage.setItem(LS_KEY, JSON.stringify(db));}catch(e){} }

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function yen(n){n=Number(n)||0;return "¥"+n.toLocaleString("ja-JP");}
function num(n){n=Number(n)||0;return n.toLocaleString("ja-JP");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function nowStamp(){const d=new Date();const p=x=>String(x).padStart(2,"0");return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function dotDate(s){return s?s.replaceAll("-","."):"";}
function custName(id){const c=db.customers.find(c=>c.id===id);return c?c.name:"(削除済み)";}
function calcTaxAt(amount, rate){
  const r=Number(rate)/100, raw=(Number(amount)||0)*r, m=db.settings.rounding;
  return m==="ceil"?Math.ceil(raw):m==="round"?Math.round(raw):Math.floor(raw);
}
function calcTax(amount){ return calcTaxAt(amount, db.settings.taxRate); }
function addDays(dateStr, n){
  const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  const p=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function csvDownload(filename, rows){
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replaceAll('"','""')+'"':c;}).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function openModal(html){$("#modalBox").innerHTML=html;$("#modalBg").classList.add("open");}
function closeModal(){$("#modalBg").classList.remove("open");}
$("#modalBg") && document.addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

/* ================= auth ================= */
function doLogin(){
  const em=$("#loginEmail").value.trim(), pw=$("#loginPw").value;
  if(em===db.profile.email && pw===db.profile.pw){
    sessionStorage.setItem("bf_login","1");
    showApp();
  }else{
    $("#loginErr").textContent="メールアドレスまたはパスワードが正しくありません。";
  }
}
function logout(){sessionStorage.removeItem("bf_login");location.reload();}
function showApp(){
  $("#loginView").style.display="none";$("#app").style.display="block";
  $("#userLabel").textContent=db.profile.name+"("+db.profile.email+")";
  show("home");
}

/* ================= router ================= */
const PAGES={};
function show(page){
  document.querySelectorAll("#sideNav a").forEach(a=>a.classList.toggle("active",a.dataset.page===page));
  PAGES[page]();
  window.scrollTo(0,0);
}
document.querySelectorAll("#sideNav a").forEach(a=>a.onclick=()=>show(a.dataset.page));
function crumb(label){return `<div class="crumb"><a onclick="show('home')">ホーム</a> / ${label}</div>`;}

/* ================= home ================= */
PAGES.home=function(){
  const ar=db.sales.filter(s=>s.status!=="入金済").reduce((t,s)=>t+Number(s.amount)+Number(s.tax),0);
  const ap=db.purchases.filter(p=>p.status!=="支払い済").reduce((t,p)=>t+Number(p.amount)+Number(p.tax),0);

let saleDraft=null, saleFormId="";
/* 適格請求書のルール: 端数処理(切り捨て/四捨五入/切り上げ)は「税率ごとに1回」。
   明細行ごとに計算して合算すると税額がずれるため、同一税率の税抜金額を
   先に合算してから消費税額を1回だけ算出する。 */
function groupByRate(items){
  const g={};
  (items||[]).forEach(it=>{
    const r=Number(it.rate)||0;
    if(!g[r]) g[r]={rate:r, sub:0};
    g[r].sub+=Number(it.amount)||0;
  });
  Object.values(g).forEach(v=>{ v.tax=calcTaxAt(v.sub, v.rate); });
  return g;
}
function saleTotals(items){
  const g=groupByRate(items);
  let sub=0,tax=0;
  Object.values(g).forEach(v=>{sub+=v.sub;tax+=v.tax;});
  return {sub,tax,total:sub+tax,groups:g};
}
function saleForm(id){
  saleFormId=id||"";

}

    sub+=a; if(it.tax==="外税")tax+=calcTax(a);

}

        <button class="btn blue small" onclick="$('#mFile').click()">⬆ CSVアップロード</button>
        <button class="btn green small" onclick="masterTemplate('${k}')">⬇ CSVテンプレート</button>
        <button class="btn ghost small" onclick="masterForm('${k}')">新規登録</button>
        <input type="file" id="mFile" accept=".csv" style="display:none">
      </div>
      <div class="card" style="overflow-x:auto">
        <table class="list">
          <tr><th>No</th><th>名称</th><th>更新日時 ↓</th><th>操作</th></tr>
          ${rows.map((r,i)=>`<tr>
            <td>${esc(r.no)}</td><td>${esc(r.name)}</td><td class="muted">${esc(r.updated)}</td>
            <td><button class="icon-btn" title="編集" onclick="masterForm('${k}',${i})">✎</button>
                <button class="icon-btn" title="削除" onclick="masterDel('${k}',${i})">🗑</button></td>
          </tr>`).join("")||`<tr><td colspan="4" class="muted" style="text-align:center;padding:16px">データがありません。CSVをアップロードしてください。</td></tr>`}
        </table>
        <div class="pager"><button>&lt;</button><button class="cur">1</button><button>&gt;</button></div>
      </div>
      <div class="muted">賃貸革命からエクスポートしたCSV(No,名称)をアップロードすると一括登録できます。</div>
    </div>`;
  $("#mQ").addEventListener("keydown",e=>{if(e.key==="Enter"){masterQ=e.target.value;show(k);}});
  $("#mFile").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const rows=parseCsv(r.result).filter(x=>x.length&&x.join("").trim());
      let added=0;
      rows.forEach((x,i)=>{
        if(i===0&&(x[0]==="No"||x[0]==="no"||x[0]==="No"))return; // header
        db.masters[k].push({no:x[0]||"",name:x[1]||"",updated:nowStamp()});added++;
      });
      save();alert(added+"件を登録しました。");show(k);
    };
    r.readAsText(f,"UTF-8");
  });
}
function parseCsv(text){
  const out=[];let row=[],cur="",q=false;
  text=String(text).replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===","){row.push(cur);cur="";}
      else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur="";}
      else cur+=ch;
    }
  }
  if(cur!==""||row.length){row.push(cur);out.push(row);}
  return out;
}
function masterExport(k){
  csvDownload(MASTERS[k]+".csv",[["No","名称","更新日時"],...(db.masters[k]||[]).map(r=>[r.no,r.name,r.updated])]);
}
function masterTemplate(k){
  csvDownload(MASTERS[k]+"_テンプレート.csv",[["No","名称"],["1","サンプル名称"]]);
}
function masterForm(k,i){
  const r=i!=null?db.masters[k][i]:{no:"",name:""};
  openModal(`
    <h3>${MASTERS[k]} ${i!=null?"編集":"新規登録"}</h3>
    <div class="grid2">
      <div class="field"><label>No</label><input id="mf_no" value="${esc(r.no)}"></div>
      <div class="field"><label><span class="req">必須</span>名称</label><input id="mf_name" value="${esc(r.name)}"></div>
    </div>
    <div class="formfoot">
      <button class="btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="masterSave('${k}',${i!=null?i:-1})">保存する</button>
    </div>`);
}
function masterSave(k,i){
  const name=$("#mf_name").value.trim();
  if(!name){alert("名称は必須です。");return;}
  const data={no:$("#mf_no").value,name,updated:nowStamp()};
  if(i>=0)db.masters[k][i]=data;else db.masters[k].push(data);
  save();closeModal();show(k);
}
function masterDel(k,i){if(confirm("削除しますか?")){db.masters[k].splice(i,1);save();show(k);}}

/* ================= clock ================= */
function tickClock(){
  const el=document.getElementById("clockTime");if(!el)return;
  const d=new Date(),p=x=>String(x).padStart(2,"0");
  el.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById("clockDate").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${"日月火水木金土"[d.getDay()]})`;
}
setInterval(tickClock,1000);tickClock();

/* ================= init ================= */
loadDb();
$("#loginPw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(sessionStorage.getItem("bf_login")==="1"){showApp();}
/* demo deep-link: #auto&page=sales&modal=cust */
(function(){
  const h=location.hash.slice(1);
  if(!h||!/(^|&)auto(&|=|$)/.test(h))return;
  const m={};h.split("&").forEach(x=>{const[k,v]=x.split("=");m[k]=v||"";});
  sessionStorage.setItem("bf_login","1");showApp();
  if(m.page&&PAGES[m.page])show(m.page);
  if(m.modal==="cust")custForm();
  else if(m.modal==="sale")saleForm();
  else if(m.modal==="pur")purForm();
  else if(m.modal==="invoice")invoiceView(m.sale?decodeURIComponent(m.sale):db.sales[0].id);
  else if(m.modal==="notice")noticeView(db.paymentNotices[0].id);
})();
</script>
