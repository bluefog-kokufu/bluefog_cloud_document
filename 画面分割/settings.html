<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefog Cloud - 会計・消費税設定</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" style="display:block">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Bluefog Cloud</div>
    <div class="userbox">
      <a class="manual-link" href="manual.html" target="_blank" title="ユーザー利用マニュアルを開く">📖 操作マニュアル</a>
      <span id="userLabel">ユーザー企業 ご担当者(user@user.com)</span>
      <button class="btn ghost small" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="sideNav">

      <div class="clock"><div class="t" id="clockTime">11:54:18</div><div class="d" id="clockDate">2026年8月6日(木)</div></div>
      <div class="navttl">MENU</div>
      <a data-page="home" class="">ホーム</a>
      <a data-page="customers" class="">顧客管理</a>
      <a data-page="sales" class="">受注取引一覧</a>
      <a data-page="purchases" class="">発注取引一覧(アップロード)</a>
      <div class="navttl">支払通知書管理</div>
      <a data-page="paynotices" class="">支払通知書一覧</a>
      <a data-page="payform" class="">支払通知書作成</a>
      <div class="navttl">会計帳簿</div>
      <a data-page="ledger" class="">総勘定元帳</a>
      <a data-page="bs" class="">貸借対照表</a>
      <a data-page="pl" class="">損益計算書</a>
      <a data-page="cf" class="">キャッシュフロー計算書</a>
      <div class="navttl">設定</div>
      <a data-page="settings" class="active">会計・消費税設定</a>
      <a data-page="profile">プロフィール</a>
    
    </nav>
    <main id="page">

    <div class="crumb"><a onclick="show('home')">ホーム</a> / 会計・消費税設定</div>
    <h2 class="pagettl">会計 / 端数・消費税設定</h2>
    <div class="panel">
      <div class="card">
        <b style="color:var(--navy)">消費税・端数処理</b>
        <div class="grid2" style="margin-top:10px">
          <div class="field"><label>消費税率(%)</label>
            <select id="st_tax"><option value="10" selected="">10%</option><option value="8">8%</option><option value="0">0%</option></select></div>
          <div class="field"><label>端数処理</label>
            <select id="st_round">
              <option value="floor" selected="">切り捨て</option>
              <option value="round">四捨五入</option>
              <option value="ceil">切り上げ</option>
            </select></div>
        </div>
      </div>
      <div class="card">
        <b style="color:var(--navy)">自社情報(請求書に記載されます)</b>
        <div class="grid2" style="margin-top:10px">
          <div class="field"><label>会社名</label><input id="st_name" value="ユーザー企業株式会社"></div>
          <div class="field"><label>適格請求書発行事業者 登録番号</label><input id="st_reg" value="T1234567890123"></div>
          <div class="field"><label>郵便番号</label><input id="st_zip" value="600-0000"></div>
          <div class="field"><label>電話番号</label><input id="st_tel" value="075-000-0000"></div>
        </div>
        <div class="field"><label>住所</label><input id="st_addr" value="京都府京都市中京区〇〇町1-2-3"></div>
        <div class="field"><label>振込先</label><input id="st_bank" value="〇〇銀行 △△支店 普通 1234567 ユーザーキギヨウ(カ"></div>
      </div>
      <div class="formfoot">
        <button class="btn" onclick="settingsSave()">保存する</button>
        <button class="btn danger" onclick="resetAll()">デモデータを初期化</button>
      </div>
    </div>
    </main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="invoicePrintArea"></div>
<script>window.INITIAL_PAGE="settings";sessionStorage.setItem("bf_login","1");</script>
<script src="js/app.txt"></script>
</body>
</html>
