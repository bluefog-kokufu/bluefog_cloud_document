<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefog Cloud - プロフィール</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" style="display:block">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Bluefog Cloud</div>
    <div class="userbox">
      <a class="manual-link" href="manual.html" target="_blank" title="ユーザー利用マニュアルを開く">📖 操作マニュアル</a>
      <span id="userLabel">ユーザー企業 ご担当者(user@user.com)</span>
      <button class="btn ghost small" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="sideNav">

      <div class="clock"><div class="t" id="clockTime">11:54:18</div><div class="d" id="clockDate">2026年8月6日(木)</div></div>
      <div class="navttl">MENU</div>
      <a data-page="home" class="">ホーム</a>
      <a data-page="customers" class="">顧客管理</a>
      <a data-page="sales" class="">受注取引一覧</a>
      <a data-page="purchases" class="">発注取引一覧(アップロード)</a>
      <div class="navttl">支払通知書管理</div>
      <a data-page="paynotices" class="">支払通知書一覧</a>
      <a data-page="payform" class="">支払通知書作成</a>
      <div class="navttl">会計帳簿</div>
      <a data-page="ledger" class="">総勘定元帳</a>
      <a data-page="bs" class="">貸借対照表</a>
      <a data-page="pl" class="">損益計算書</a>
      <a data-page="cf" class="">キャッシュフロー計算書</a>
      <div class="navttl">設定</div>
      <a data-page="settings" class="">会計・消費税設定</a>
      <a data-page="profile" class="active">プロフィール</a>
    
    </nav>
    <main id="page">

    <div class="crumb"><a onclick="show('home')">ホーム</a> / プロフィール</div>
    <h2 class="pagettl">プロフィール編集</h2>
    <div class="panel">
      <div class="card">
        <div class="field"><label>氏名</label><input id="pr_name" value="ユーザー企業 ご担当者"></div>
        <div class="field"><label>メールアドレス(ログインID)</label><input id="pr_email" value="user@user.com"></div>
        <div class="formfoot"><button class="btn" onclick="profileSave()">保存する</button></div>
      </div>
      <div class="card">
        <b style="color:var(--navy)">パスワード変更</b>
        <div class="grid2" style="margin-top:10px">
          <div class="field"><label>現在のパスワード</label><input type="password" id="pw_old"></div>
          <div class="field"><label>新しいパスワード</label><input type="password" id="pw_new"></div>
        </div>
        <div class="formfoot"><button class="btn" onclick="pwChange()">パスワードを変更する</button></div>
      </div>
    </div>
    </main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="invoicePrintArea"></div>
<script>window.INITIAL_PAGE="profile";sessionStorage.setItem("bf_login","1");</script>
<script src="js/app.txt"></script>
</body>
</html>
