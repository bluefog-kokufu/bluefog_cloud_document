<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefog Cloud - ログイン</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <h1>Bluefog Cloud</h1>
    <div class="sub">ログイン画面</div>
    <label>メールアドレス</label>
    <input type="email" id="loginEmail" placeholder="user@user.com" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="loginPw" placeholder="パスワード" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn block" onclick="doLogin()">ログインする</button>
    <div class="login-links">
      <a onclick="alert('デモ版のため会員登録は省略されています。\nuser@user.com / password でログインしてください。')">会員登録はこちら</a>
      <a onclick="alert('デモ版のためパスワード再発行は省略されています。')">パスワードを忘れた方</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Bluefog Cloud</div>
    <div class="userbox">
      <a class="manual-link" href="manual.html" target="_blank" title="ユーザー利用マニュアルを開く">📖 操作マニュアル</a>
      <span id="userLabel"></span>
      <button class="btn ghost small" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="sideNav">
      <div class="clock"><div class="t" id="clockTime">--:--:--</div><div class="d" id="clockDate"></div></div>
      <div class="navttl">MENU</div>
      <a data-page="home">ホーム</a>
      <a data-page="customers">顧客管理</a>
      <a data-page="sales">受注取引一覧</a>
      <a data-page="purchases">発注取引一覧(アップロード)</a>
      <div class="navttl">支払通知書管理</div>
      <a data-page="paynotices">支払通知書一覧</a>
      <a data-page="payform">支払通知書作成</a>
      <div class="navttl">会計帳簿</div>
      <a data-page="ledger">総勘定元帳</a>
      <a data-page="bs">貸借対照表</a>
      <a data-page="pl">損益計算書</a>
      <a data-page="cf">キャッシュフロー計算書</a>
      <div class="navttl">設定</div>
      <a data-page="settings">会計・消費税設定</a>
      <a data-page="profile">プロフィール</a>
    </nav>
    <main id="page"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="invoicePrintArea"></div>
<script>window.INITIAL_PAGE="home";</script>
<script src="js/app.txt"></script>
</body>
</html>
